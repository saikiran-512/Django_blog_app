
{% extends "blog/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block page_class %}no-sidebar{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>{{ title }}</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save post</button>
                <a href="{% url 'blog:my_posts' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}

{% block sidebar %}{% endblock %}
